{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                {{if .OK}}
                <div class="alert alert-success">
                    <i class="bi bi-check-circle me-1"></i>Пароль успешно изменён
                </div>
                {{end}}
                {{if .Error}}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle me-1"></i>{{.Error}}
                </div>
                {{end}}
                <form method="POST" action="{{.AdminBase}}/change-password">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Текущий пароль</label>
                        <input type="password" id="current_password" name="current_password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Новый пароль</label>
                        <input type="password" id="new_password" name="new_password" class="form-control" required autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Подтвердите новый пароль</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-key-fill me-1"></i>Сменить пароль
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
