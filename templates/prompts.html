{{define "content"}}
<div class="row g-4">
    <!-- Категории -->
    <div class="col-md-5">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Категории</span>
                <button class="btn btn-sm btn-primary" onclick="showCatForm()">+ Добавить</button>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush" id="catList">
                    {{range .Categories}}
                    <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 cat-row"
                            data-id="{{.ID}}" onclick="loadPrompts({{.ID}}, '{{.Name}}')">
                        <div>
                            <span class="fw-semibold">{{.Name}}</span>
                            <span class="badge bg-secondary ms-2 fw-normal" style="font-size:.7rem">{{.Gender}}</span>
                            {{if not .IsActive}}<span class="badge bg-warning text-dark ms-1 fw-normal" style="font-size:.7rem">неакт.</span>{{end}}
                        </div>
                        <button class="btn btn-sm btn-outline-danger border-0 p-1"
                                onclick="event.stopPropagation();deleteCategory({{.ID}})" title="Удалить">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </button>
                    {{end}}
                </div>
            </div>
        </div>
    </div>

    <!-- Промты -->
    <div class="col-md-7">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-semibold" id="promptsTitle">Промты</span>
                <button class="btn btn-sm btn-primary" id="addPromptBtn" style="display:none" onclick="showPromptForm()">+ Добавить</button>
            </div>
            <div class="card-body p-0" id="promptsBody">
                <p class="text-muted px-3 py-3 mb-0">Выберите категорию для просмотра промтов</p>
            </div>
        </div>
    </div>
</div>

<!-- Форма категории -->
<div class="modal fade" id="catModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Новая категория</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" class="form-control" id="catName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пол</label>
                    <select class="form-select" id="catGender">
                        <option value="any">Любой</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                        <option value="couple">Парное</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Порядок</label>
                    <input type="number" class="form-control" id="catSort" value="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="createCategory()">Создать</button>
            </div>
        </div>
    </div>
</div>

<!-- Форма промта -->
<div class="modal fade" id="promptModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Новый промт</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="promptId">
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" class="form-control" id="promptName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Промт (для AI)</label>
                    <textarea class="form-control" id="promptText" rows="4"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Пол</label>
                        <select class="form-select" id="promptGender">
                            <option value="any">Любой</option>
                            <option value="male">Мужской</option>
                            <option value="female">Женский</option>
                            <option value="couple">Парное</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Порядок</label>
                        <input type="number" class="form-control" id="promptSort" value="0">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="savePrompt()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentCatId = null;
let allPrompts = [];

function genderBadge(g) {
    return {any:'bg-secondary', male:'bg-primary', female:'bg-danger', couple:'bg-success'}[g] ?? 'bg-secondary';
}

function showCatForm() {
    new bootstrap.Modal(document.getElementById('catModal')).show();
}

function showPromptForm() {
    document.getElementById('promptId').value = '';
    document.getElementById('promptName').value = '';
    document.getElementById('promptText').value = '';
    document.getElementById('promptGender').value = 'any';
    document.getElementById('promptSort').value = '0';
    document.querySelector('#promptModal .modal-title').textContent = 'Новый промт';
    new bootstrap.Modal(document.getElementById('promptModal')).show();
}

function editPrompt(p) {
    document.getElementById('promptId').value = p.id;
    document.getElementById('promptName').value = p.name;
    document.getElementById('promptText').value = p.prompt;
    document.getElementById('promptGender').value = p.gender;
    document.getElementById('promptSort').value = p.sort_order;
    document.querySelector('#promptModal .modal-title').textContent = 'Редактировать промт';
    new bootstrap.Modal(document.getElementById('promptModal')).show();
}

function filterPrompts(val) {
    renderPrompts(val);
}

function renderPrompts(filter) {
    const q = filter.toLowerCase();
    const visible = allPrompts.filter(p =>
        p.name.toLowerCase().includes(q) || p.prompt.toLowerCase().includes(q)
    );
    const list = document.getElementById('promptsList');
    if (!visible.length) {
        list.innerHTML = '<div class="list-group-item text-muted px-3 py-2">Нет промтов</div>';
        return;
    }
    list.innerHTML = visible.map(p => `
        <div class="list-group-item px-3 py-2">
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div class="flex-grow-1" style="cursor:pointer" onclick='editPrompt(${JSON.stringify(p)})'>
                    <div class="fw-semibold">${p.name}</div>
                    <small class="text-muted">${p.prompt.substring(0, 80)}…</small>
                </div>
                <div class="d-flex align-items-center gap-1 flex-shrink-0">
                    <span class="badge ${genderBadge(p.gender)}">${p.gender}</span>
                    <button class="btn btn-sm btn-outline-primary border-0 p-1" onclick='editPrompt(${JSON.stringify(p)})' title="Редактировать"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger border-0 p-1" onclick="deletePrompt(${p.id})" title="Удалить"><i class="bi bi-trash3"></i></button>
                </div>
            </div>
        </div>`).join('');
}

async function loadPrompts(catId, catName) {
    currentCatId = catId;
    document.querySelectorAll('.cat-row').forEach(r => r.classList.remove('active'));
    document.querySelector(`.cat-row[data-id="${catId}"]`)?.classList.add('active');
    document.getElementById('promptsTitle').textContent = catName;
    document.getElementById('addPromptBtn').style.display = '';
    const resp = await fetch(`/admin/categories/${catId}/prompts`);
    allPrompts = await resp.json() ?? [];
    const body = document.getElementById('promptsBody');
    body.innerHTML = `
        <div class="px-3 pt-3 pb-2">
            <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="promptSearch"
                       placeholder="Поиск по названию или тексту..." oninput="filterPrompts(this.value)">
            </div>
        </div>
        <div class="list-group list-group-flush" id="promptsList"></div>`;
    renderPrompts('');
}

async function createCategory() {
    const body = {
        name: document.getElementById('catName').value,
        gender: document.getElementById('catGender').value,
        sort_order: parseInt(document.getElementById('catSort').value),
    };
    const resp = await fetch('/admin/categories', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (resp.ok) location.reload();
    else alert('Ошибка');
}

async function deleteCategory(id) {
    if (!confirm('Удалить категорию?')) return;
    const resp = await fetch(`/admin/categories/${id}`, {method:'DELETE'});
    if (resp.ok) location.reload();
    else alert('Ошибка');
}

async function savePrompt() {
    const id = document.getElementById('promptId').value;
    const body = {
        category_id: currentCatId,
        name: document.getElementById('promptName').value,
        prompt: document.getElementById('promptText').value,
        gender: document.getElementById('promptGender').value,
        sort_order: parseInt(document.getElementById('promptSort').value),
        is_active: true,
    };
    const url = id ? `/admin/prompts/${id}` : `/admin/categories/${currentCatId}/prompts`;
    const method = id ? 'PUT' : 'POST';
    const resp = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (resp.ok) {
        const searchEl = document.getElementById('promptSearch');
        if (searchEl) searchEl.value = '';
        bootstrap.Modal.getInstance(document.getElementById('promptModal')).hide();
        loadPrompts(currentCatId, document.getElementById('promptsTitle').textContent);
    } else {
        alert('Ошибка');
    }
}

async function deletePrompt(id) {
    if (!confirm('Удалить промт?')) return;
    const resp = await fetch(`/admin/prompts/${id}`, {method:'DELETE'});
    if (resp.ok) {
        const searchEl = document.getElementById('promptSearch');
        if (searchEl) searchEl.value = '';
        loadPrompts(currentCatId, document.getElementById('promptsTitle').textContent);
    } else {
        alert('Ошибка');
    }
}
</script>
{{end}}
