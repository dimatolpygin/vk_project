{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — VK Нейробот Админка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .sidebar { width: 220px; min-height: 100vh; background: #1a1a2e; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); border-radius: 6px; }
        .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.1rem; padding: 1.5rem 1rem 1rem; }
        .main-content { flex: 1; background: #f8f9fa; min-height: 100vh; }
        .stat-card { border-left: 4px solid; }
        .stat-card.primary { border-color: #0d6efd; }
        .stat-card.success { border-color: #198754; }
        .stat-card.warning { border-color: #ffc107; }
        .stat-card.info { border-color: #0dcaf0; }
    </style>
</head>
<body>
<div class="d-flex">
    <nav class="sidebar d-flex flex-column p-2">
        <div class="brand">🤖 VK Нейробот</div>
        <ul class="nav flex-column gap-1 mt-2">
            <li class="nav-item">
                <a href="/admin/stats" class="nav-link px-3 py-2 {{if eq .Active "stats"}}active{{end}}">
                    📊 Статистика
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/users" class="nav-link px-3 py-2 {{if eq .Active "users"}}active{{end}}">
                    👥 Пользователи
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/tariffs" class="nav-link px-3 py-2 {{if eq .Active "tariffs"}}active{{end}}">
                    💳 Тарифы
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/messages" class="nav-link px-3 py-2 {{if eq .Active "messages"}}active{{end}}">
                    💬 Сообщения
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/categories" class="nav-link px-3 py-2 {{if eq .Active "prompts"}}active{{end}}">
                    🎨 Категории / Промты
                </a>
            </li>
        </ul>
    </nav>
    <main class="main-content p-4">
        <h4 class="mb-4 fw-bold">{{.Title}}</h4>
        {{template "content" .}}
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{{end}}
