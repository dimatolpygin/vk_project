{{define "content"}}
<p class="text-muted mb-3">Редактируйте тексты и изображения бота. Изменения применяются мгновенно без перезапуска.</p>

<div class="accordion" id="messagesAccordion">
    {{range $i, $m := .Messages}}
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button"
                data-bs-toggle="collapse" data-bs-target="#msg-{{$m.Key}}">
                <code class="me-2">{{$m.Key}}</code>
                <span class="text-muted small text-truncate" style="max-width:400px">{{$m.Text}}</span>
            </button>
        </h2>
        <div id="msg-{{$m.Key}}" class="accordion-collapse collapse">
            <div class="accordion-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Текст сообщения</label>
                    <textarea class="form-control" id="text-{{$m.Key}}" rows="4">{{$m.Text}}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Изображение</label>
                    <div class="input-group">
                        <input type="file" class="form-control" id="file-{{$m.Key}}" accept="image/*"
                               onchange="uploadFile('{{$m.Key}}')">
                        <input type="text" class="form-control" id="img-{{$m.Key}}"
                               value="{{if $m.ImageURL}}{{$m.ImageURL}}{{end}}" placeholder="URL изображения">
                    </div>
                    <div id="upload-status-{{$m.Key}}" class="text-muted small mt-1" style="display:none"></div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary btn-sm"
                        onclick="saveMessage('{{$m.Key}}')">Сохранить</button>
                    <span id="saved-{{$m.Key}}" class="text-success small align-self-center" style="display:none">✓ Сохранено</span>
                </div>
            </div>
        </div>
    </div>
    {{end}}
</div>

<script>
async function uploadFile(key) {
    const file = document.getElementById('file-' + key).files[0];
    if (!file) return;
    const el = document.getElementById('upload-status-' + key);
    el.style.display = 'inline';
    el.textContent = 'Загружаю...';
    const fd = new FormData();
    fd.append('file', file);
    const resp = await fetch('/admin/upload', {method: 'POST', body: fd});
    if (resp.ok) {
        const {url} = await resp.json();
        document.getElementById('img-' + key).value = url;
        el.textContent = '✓ Загружено';
    } else {
        el.textContent = '❌ Ошибка загрузки';
    }
}

async function saveMessage(key) {
    const text = document.getElementById('text-' + key).value;
    const img = document.getElementById('img-' + key).value;
    const body = {key, text, image_url: img || null, buttons: []};
    const resp = await fetch('/admin/messages', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    if (resp.ok) {
        const el = document.getElementById('saved-' + key);
        el.style.display = 'inline';
        setTimeout(() => el.style.display = 'none', 2000);
    } else {
        alert('Ошибка сохранения');
    }
}
</script>
{{end}}
